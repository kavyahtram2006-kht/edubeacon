<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Examination - EduBeacon</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
    body{background:#f0f0f8;color:#1a1a2e;}
    /* SIDEBAR */
    .sidebar{position:fixed;left:0;top:0;width:248px;height:100vh;background:linear-gradient(180deg,#5b3cc4,#7b5be7);color:#fff;padding:22px 16px;display:flex;flex-direction:column;}
    .logo{text-align:center;font-size:24px;font-weight:800;margin-bottom:36px;letter-spacing:.5px;}
    .logo span{color:#dcd2ff;}
    .menu{list-style:none;}
    .menu li{margin:6px 0;}
    .menu a{display:block;padding:13px 16px;text-decoration:none;color:#dcd2ff;border-radius:10px;font-size:14px;transition:.25s;}
    .menu a:hover,.menu a.active{background:rgba(255,255,255,.18);color:#fff;transform:translateX(3px);}
    .logout{margin-top:auto;}
    .logout a{background:rgba(255,255,255,.12);}
    /* MAIN */
    .main{margin-left:248px;padding:36px 48px;min-height:100vh;}
    /* HEADER */
    .page-header{margin-bottom:30px;}
    .page-header h1{font-size:26px;font-weight:800;color:#1a1a2e;margin-bottom:6px;}
    .page-header p{color:#888;font-size:13px;}
    /* FORM CARD */
    .form-card{background:#fff;border-radius:20px;padding:36px;box-shadow:0 8px 32px rgba(0,0,0,.08);max-width:680px;}
    .form-group{margin-bottom:22px;}
    .row-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
    label{display:block;font-size:13px;font-weight:700;color:#444;margin-bottom:8px;letter-spacing:.2px;}
    label .req{color:#e53935;margin-left:2px;}
    input[type=text],input[type=date],textarea,select{
      width:100%;padding:12px 16px;border:1.5px solid #e0ddf5;border-radius:10px;
      font-size:14px;outline:none;transition:.25s;background:#fafafa;color:#1a1a2e;}
    input:focus,textarea:focus,select:focus{border-color:#6542df;background:#fff;box-shadow:0 0 0 3px rgba(101,66,223,.1);}
    textarea{resize:vertical;min-height:110px;}
    .hint{font-size:11px;color:#aaa;margin-top:5px;}
    /* SUBMIT */
    .submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#6542df,#8b5cf6);color:#fff;border:none;
      border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:.25s;letter-spacing:.3px;margin-top:4px;}
    .submit-btn:hover{opacity:.9;box-shadow:0 6px 20px rgba(101,66,223,.35);transform:translateY(-1px);}
    /* BACK LINK */
    .back-link{display:inline-flex;align-items:center;gap:6px;margin-top:20px;color:#6542df;font-size:13px;font-weight:600;text-decoration:none;}
    .back-link:hover{text-decoration:underline;}
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">Edu<span>Beacon</span></div>
    <ul class="menu">
      <li><a href="{{ url_for('faculty_dashboard') }}">🏠 Dashboard</a></li>
      <li><a href="{{ url_for('faculty_add_assignment') }}">📝 Add Assignment</a></li>
      <li><a href="{{ url_for('faculty_add_examination') }}" class="active">📚 Add Examination</a></li>
      <li><a href="{{ url_for('faculty_add_announcement') }}">📢 Add Announcement</a></li>
      <li><a href="{{ url_for('faculty_add_note') }}">📖 Add Study Notes</a></li>
      <li class="logout"><a href="{{ url_for('logout') }}">🚪 Logout</a></li>
    </ul>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="page-header">
      <h1>📚 Add Examination</h1>
      <p>Schedule an upcoming exam with date, time and instructions.</p>
    </div>

    <div class="form-card">
      <form method="POST">

        <div class="form-group">
          <label>Subject <span class="req">*</span></label>
          <input type="text" name="subject" placeholder="e.g. Operating Systems" required>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label>Exam Date <span class="req">*</span></label>
            <input type="date" name="exam_date" required>
          </div>
          <div class="form-group">
            <label>Exam Time</label>
            <input type="text" name="exam_time" placeholder="e.g. 10:00 AM – 1:00 PM">
            <div class="hint">Leave blank if time is not yet decided.</div>
          </div>
        </div>

        <div class="form-group">
          <label>Description / Instructions</label>
          <textarea name="description" placeholder="Enter exam instructions, syllabus coverage, hall info, etc."></textarea>
        </div>

        <button type="submit" class="submit-btn">📚 Add Examination</button>
      </form>

      <a href="{{ url_for('faculty_dashboard') }}" class="back-link">← Back to Dashboard</a>
    </div>
  </div>

</body>
</html>
