<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduBeacon</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #e0eaff, #f5f3ff);
        }

        .container {
            width: 850px;
            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;

            font-size: 36px;

            font-weight: bold;

            color: #4f46e5;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-bottom: 35px;
        }

        .boxes {
            display: flex;

            gap: 25px;
        }

        .box {
            flex: 1;

            padding: 30px;

            border: 1px solid #ddd;

            border-radius: 15px;

            text-align: center;
        }

        .box h2 {
            margin-bottom: 15px;
        }

        .box p {
            color: #64748b;

            margin-bottom: 20px;
        }

        .register-btn,
        .login-btn {

            display: block;

            width: 100%;

            padding: 13px;

            margin-top: 12px;

            border-radius: 8px;

            text-decoration: none;

            font-weight: bold;
        }

        .register-btn {
            background: #4f46e5;

            color: white;
        }

        .login-btn {
            background: white;

            color: #4f46e5;

            border: 2px solid #4f46e5;
        }

        .register-btn:hover {
            background: #3730a3;
        }

        .login-btn:hover {
            background: #eef2ff;
        }

        @media (max-width: 700px) {

            .boxes {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="logo">
            EduBeacon
        </div>

        <p class="subtitle">
            Intelligent Priority-Based Academic Alert System
        </p>


        <div class="boxes">


            <!-- STUDENT -->

            <div class="box">

                <h2>👩‍🎓 Student</h2>

                <p>
                    Students can view academic information
                    and receive priority alerts.
                </p>

                <a href="/student-register"
                   class="register-btn">
                    Register
                </a>

                <a href="/student-login"
                   class="login-btn">
                    Login
                </a>

            </div>



            <!-- STAFF -->

            <div class="box">

                <h2>👨‍🏫 Staff</h2>

                <p>
                    Staff can manage and update
                    academic information.
                </p>

                <a href="/staff-register"
                   class="register-btn">
                    Register
                </a>

                <a href="/staff-login"
                   class="login-btn">
                    Login
                </a>

            </div>


        </div>

    </div>

</body>

</html>
