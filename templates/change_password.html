<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password – EduBeacon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{min-height:100vh;background:#f6f4ff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#fff;border-radius:20px;padding:48px;width:420px;max-width:100%;box-shadow:0 15px 50px rgba(80,50,160,.12)}
h2{font-size:26px;color:#29233f;margin-bottom:6px}
p.sub{color:#888;font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;color:#333;margin-bottom:7px}
input{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none;transition:.3s}
input:focus{border-color:#6544d3;box-shadow:0 0 0 3px rgba(101,68,211,.1)}
.btn{width:100%;padding:14px;background:#6544d3;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;transition:.3s}
.btn:hover{background:#5033b5}
.error{background:#ffe9e9;color:#c62828;padding:12px;border-radius:8px;margin-bottom:18px;font-size:14px;border-left:3px solid #c62828}
.success{background:#e8ffe8;color:#1a7a3c;padding:12px;border-radius:8px;margin-bottom:18px;font-size:14px;border-left:3px solid #27ae60}
.links{text-align:center;margin-top:20px}
.links a{color:#6544d3;text-decoration:none;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <h2>🔑 Change Password</h2>
  <p class="sub">Update your account password</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if success %}<div class="success">{{ success }}</div>{% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Current Password</label>
      <input type="password" name="current_password" required placeholder="Enter current password">
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" name="new_password" required placeholder="At least 6 characters">
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <input type="password" name="confirm_password" required placeholder="Repeat new password">
    </div>
    <button type="submit" class="btn">Update Password</button>
  </form>
  <div class="links">
    <a href="/profile">← Back to Profile</a>
  </div>
</div>
</body></html>
