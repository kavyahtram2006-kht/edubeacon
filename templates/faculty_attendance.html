<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faculty Attendance – EduBeacon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f4f5ff;color:#1a1a2e}
header{background:linear-gradient(135deg,#5145cd,#8175ed);color:#fff;padding:25px 40px}
header h1{font-size:26px}
.container{padding:36px 40px;max-width:900px}
h2{color:#29245e;margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:#333}
.form-group select,.form-group input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none}
.form-group select:focus,.form-group input:focus{border-color:#6544d3}
.student-table{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.student-table table{width:100%;border-collapse:collapse}
.student-table th{background:#f0ecff;padding:12px 16px;font-size:12px;font-weight:800;color:#5b35d5;text-align:left}
.student-table td{padding:12px 16px;border-bottom:1px solid #f0ecff;font-size:13px}
.student-table tr:last-child td{border-bottom:none}
.radio-group{display:flex;gap:12px}
.radio-group label{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer}
.radio-group input[type=radio]{accent-color:#6542df}
.btn{padding:12px 28px;background:#5145cd;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;margin-top:20px}
.btn:hover{background:#3d35b5}
.success{background:#e8ffe8;border:1px solid #a3d9a3;padding:14px 18px;border-radius:10px;color:#1a7a3c;margin-bottom:20px;font-weight:600}
.back-link{color:#5145cd;text-decoration:none;font-weight:600;display:inline-block;margin-top:16px}
</style>
</head>
<body>
<header><h1>EduBeacon — Faculty Attendance</h1></header>
<div class="container">
  <h2>📊 Mark Attendance</h2>

  {% if message %}<div class="success">✅ {{ message }}</div>{% endif %}

  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label>Subject</label>
        <select name="subject" required>
          <option value="">Select Subject</option>
          {% for s in subjects %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" name="att_date" value="{{ today }}" required>
      </div>
      <div class="form-group">
        <label>Semester</label>
        <select name="semester">
          {% for i in range(1,9) %}<option value="{{ i }}">Semester {{ i }}</option>{% endfor %}
        </select>
      </div>
    </div>

    {% if students %}
    <div class="student-table">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>USN</th><th>Status</th></tr></thead>
        <tbody>
          {% for s in students %}
          <tr>
            <td>{{ loop.index }}</td>
            <td>{{ s.name }}</td>
            <td>{{ s.usn }}</td>
            <td>
              <div class="radio-group">
                <label><input type="radio" name="status_{{ s.id }}" value="present" checked> Present</label>
                <label><input type="radio" name="status_{{ s.id }}" value="absent"> Absent</label>
                <label><input type="radio" name="status_{{ s.id }}" value="late"> Late</label>
              </div>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    <button type="submit" class="btn">💾 Save Attendance</button>
    {% endif %}
  </form>

  <div style="margin-top:20px;display:flex;gap:14px;flex-wrap:wrap">
    <a href="/faculty/attendance/report" class="btn" style="background:#27ae60">📋 View Report</a>
    <a href="{{ url_for('faculty_dashboard') }}" class="back-link">← Back to Dashboard</a>
  </div>
</div>
</body></html>
